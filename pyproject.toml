[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-shortage-research-priority-board"
version = "0.1.0"
description = "Drug Shortage Research Priority Board Intelligent Contract and Tests"
requires-python = ">=3.11"
dependencies = [
    "genlayer-test==0.29.2",
    "genvm-linter==0.11.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
